name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show structure
        run: |
          ls -R

      - name: Archive artifact
        run: |
          zip -r weapp-artifact.zip miniprogram cloudfunctions README.md || true
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weapp-artifact
          path: weapp-artifact.zip

